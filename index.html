-- GREEN HOUSE — SPORTS & CULTURAL PARTICIPATION PORTAL
-- REV. WILLIAM WARD SENIOR SECONDARY SCHOOL
-- Complete PostgreSQL Schema + Row Level Security (RLS) + Triggers
-- Run this entire script inside your Supabase SQL Editor
-- ============================================================================

CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- 1. Portal Settings Table (Singleton row id = 1)
CREATE TABLE IF NOT EXISTS public.portal_settings (
  id INTEGER PRIMARY KEY CHECK (id = 1),
  registration_open BOOLEAN NOT NULL DEFAULT TRUE,
  academic_year TEXT NOT NULL DEFAULT '2026-2027',
  event_title TEXT NOT NULL DEFAULT 'SPORTS & CULTURAL WEEK',
  teacher_permissions JSONB NOT NULL DEFAULT '{
    "can_edit_participants": true,
    "can_delete_participants": false,
    "can_manage_events": true,
    "can_toggle_registration": true,
    "can_export_data": true
  }'::jsonb,
  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

INSERT INTO public.portal_settings (id, registration_open)
VALUES (1, TRUE)
ON CONFLICT (id) DO NOTHING;

-- 2. Events Table (Sports & Cultural)
CREATE TABLE IF NOT EXISTS public.events (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  name TEXT NOT NULL,
  type TEXT NOT NULL CHECK (type IN ('sports', 'cultural')),
  category TEXT NOT NULL DEFAULT 'General',
  is_active BOOLEAN NOT NULL DEFAULT TRUE,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  UNIQUE (name, type)
);

-- 3. Student Registrations Table
CREATE TABLE IF NOT EXISTS public.registrations (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  full_name TEXT NOT NULL CHECK (char_length(trim(full_name)) >= 2),
  roll_number TEXT NOT NULL UNIQUE CHECK (char_length(trim(roll_number)) >= 1),
  sports_events UUID[] NOT NULL DEFAULT '{}',
  cultural_events UUID[] NOT NULL DEFAULT '{}',
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  CONSTRAINT at_least_one_event CHECK (
    coalesce(array_length(sports_events, 1), 0) +
    coalesce(array_length(cultural_events, 1), 0) >= 1
  )
);

CREATE INDEX IF NOT EXISTS idx_registrations_roll_number ON public.registrations (roll_number);
CREATE INDEX IF NOT EXISTS idx_registrations_created_at ON public.registrations (created_at DESC);

-- 4. Management Profiles Table (Linked to Supabase Auth users)
CREATE TABLE IF NOT EXISTS public.management_profiles (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  email TEXT NOT NULL UNIQUE,
  full_name TEXT NOT NULL,
  role TEXT NOT NULL CHECK (role IN ('Captain', 'Vice Captain', 'Volunteer', 'Teacher')),
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

-- 5. Audit Logs Table
CREATE TABLE IF NOT EXISTS public.audit_logs (
  id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
  actor_email TEXT NOT NULL,
  actor_role TEXT NOT NULL,
  action TEXT NOT NULL,
  details TEXT NOT NULL,
  created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
);

CREATE INDEX IF NOT EXISTS idx_audit_logs_created_at ON public.audit_logs (created_at DESC);

-- ============================================================================
-- HELPER SECURITY FUNCTIONS (SECURITY DEFINER)
-- ============================================================================

CREATE OR REPLACE FUNCTION public.get_my_management_role()
RETURNS TEXT
LANGUAGE sql
STABLE
SECURITY DEFINER
SET search_path = public
AS $$
  SELECT role FROM public.management_profiles WHERE id = auth.uid();
$$;

CREATE OR REPLACE FUNCTION public.is_management_member()
RETURNS BOOLEAN
LANGUAGE sql
STABLE
SECURITY DEFINER
SET search_path = public
AS $$
  SELECT EXISTS (SELECT 1 FROM public.management_profiles WHERE id = auth.uid());
$$;

CREATE OR REPLACE FUNCTION public.can_teacher_perform(perm_key TEXT)
RETURNS BOOLEAN
LANGUAGE sql
STABLE
SECURITY DEFINER
SET search_path = public
AS $$
  SELECT coalesce((teacher_permissions ->> perm_key)::boolean, false)
  FROM public.portal_settings
  WHERE id = 1;
$$;

-- Normalize roll_number & full_name before insert/update
CREATE OR REPLACE FUNCTION public.normalize_registration()
RETURNS TRIGGER
LANGUAGE plpgsql
AS $$
BEGIN
  NEW.full_name := trim(regexp_replace(NEW.full_name, '\\s+', ' ', 'g'));
  NEW.roll_number := upper(trim(regexp_replace(NEW.roll_number, '\\s+', '', 'g')));
  NEW.updated_at := NOW();
  RETURN NEW;
END;
$$;

DROP TRIGGER IF EXISTS trg_normalize_registration ON public.registrations;
CREATE TRIGGER trg_normalize_registration
BEFORE INSERT OR UPDATE ON public.registrations
FOR EACH ROW EXECUTE FUNCTION public.normalize_registration();

-- ============================================================================
-- ROW LEVEL SECURITY (RLS) POLICIES
-- ============================================================================

ALTER TABLE public.portal_settings ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.events ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.registrations ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.management_profiles ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.audit_logs ENABLE ROW LEVEL SECURITY;

-- Portal Settings
CREATE POLICY "Public can read portal settings"
  ON public.portal_settings FOR SELECT USING (true);

CREATE POLICY "Authorized management can update portal settings"
  ON public.portal_settings FOR UPDATE
  USING (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_toggle_registration'))
  );

-- Events
CREATE POLICY "Public can view events"
  ON public.events FOR SELECT USING (true);

CREATE POLICY "Authorized management can insert events"
  ON public.events FOR INSERT
  WITH CHECK (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_manage_events'))
  );

CREATE POLICY "Authorized management can update events"
  ON public.events FOR UPDATE
  USING (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_manage_events'))
  );

CREATE POLICY "Authorized management can delete events"
  ON public.events FOR DELETE
  USING (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_manage_events'))
  );

-- Registrations (Students can ONLY INSERT when open; ZERO public SELECT/UPDATE/DELETE)
CREATE POLICY "Students can submit registration when portal is open"
  ON public.registrations FOR INSERT
  WITH CHECK ((SELECT registration_open FROM public.portal_settings WHERE id = 1) = TRUE);

CREATE POLICY "Management can view registrations"
  ON public.registrations FOR SELECT
  USING (public.is_management_member());

CREATE POLICY "Authorized management can update registrations"
  ON public.registrations FOR UPDATE
  USING (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_edit_participants'))
  );

CREATE POLICY "Authorized management can delete registrations"
  ON public.registrations FOR DELETE
  USING (
    public.get_my_management_role() IN ('Captain', 'Vice Captain')
    OR (public.get_my_management_role() = 'Teacher' AND public.can_teacher_perform('can_delete_participants'))
  );

-- Management Profiles & Audit Logs
CREATE POLICY "Management can read profiles"
  ON public.management_profiles FOR SELECT
  USING (public.is_management_member());

CREATE POLICY "Management can read audit logs"
  ON public.audit_logs FOR SELECT
  USING (public.is_management_member());

CREATE POLICY "Management can insert audit logs"
  ON public.audit_logs FOR INSERT
  WITH CHECK (public.is_management_member());

ON CONFLICT (name, type) DO NOTHING;`;
